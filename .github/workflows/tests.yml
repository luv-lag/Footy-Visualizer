name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (lightweight project venv, no torch)
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run --frozen pytest -q
